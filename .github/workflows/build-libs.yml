name: Build Rust Shared Libraries

on:
  workflow_dispatch:  # Allow manual runs

# The gem (including the Rust extension and the prebuilt-binary destination under
# lib/solace/utils/) lives in gem/, so all run steps execute from there. Note that
# upload/download-artifact `path:` values are resolved from the workspace root, so
# they carry an explicit gem/ prefix.
defaults:
  run:
    working-directory: gem

jobs:
  build-linux:
    name: Build on Linux
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: x86_64-unknown-linux-gnu

      - name: Build Linux shared lib
        run: |
          cargo build --manifest-path=ext/curve25519_dalek/Cargo.toml --release --target=x86_64-unknown-linux-gnu
          mkdir -p lib/solace/utils/linux
          cp ext/curve25519_dalek/target/x86_64-unknown-linux-gnu/release/libcurve25519_dalek.so lib/solace/utils/linux/

      - uses: actions/upload-artifact@v4
        with:
          name: libcurve25519_dalek-linux
          path: gem/lib/solace/utils/linux/libcurve25519_dalek.so

  build-windows:
    name: Build on Windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: x86_64-pc-windows-msvc

      - name: Build Windows shared lib
        run: |
          cargo build --manifest-path=ext/curve25519_dalek/Cargo.toml --release --target=x86_64-pc-windows-msvc
          mkdir -p lib/solace/utils/windows
          copy ext\curve25519_dalek\target\x86_64-pc-windows-msvc\release\curve25519_dalek.dll lib\solace\utils\windows\

      - uses: actions/upload-artifact@v4
        with:
          name: libcurve25519_dalek-windows
          path: gem/lib/solace/utils/windows/curve25519_dalek.dll

  build-macos:
    name: Build on macOS
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: x86_64-apple-darwin

      - name: Build macOS shared lib
        shell: bash
        run: |
          cargo build --manifest-path=ext/curve25519_dalek/Cargo.toml --release --target=x86_64-apple-darwin
          mkdir -p lib/solace/utils/macos
          cp ext/curve25519_dalek/target/x86_64-apple-darwin/release/libcurve25519_dalek.dylib lib/solace/utils/macos/

      - uses: actions/upload-artifact@v4
        with:
          name: libcurve25519_dalek-macos
          path: gem/lib/solace/utils/macos/libcurve25519_dalek.dylib

  build-macos-arm64:
    name: Build on macOS ARM64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: aarch64-apple-darwin

      - name: Build macOS ARM64 shared lib
        shell: bash
        run: |
          cargo build --manifest-path=ext/curve25519_dalek/Cargo.toml --release --target=aarch64-apple-darwin
          mkdir -p lib/solace/utils/macos-arm64
          cp ext/curve25519_dalek/target/aarch64-apple-darwin/release/libcurve25519_dalek.dylib lib/solace/utils/macos-arm64/

      - uses: actions/upload-artifact@v4
        with:
          name: libcurve25519_dalek-macos-arm64
          path: gem/lib/solace/utils/macos-arm64/libcurve25519_dalek.dylib

  build-linux-arm64:
    name: Build on Linux ARM64
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v3

      - name: Install Rust
        uses: actions-rs/toolchain@v1
        with:
          profile: minimal
          toolchain: stable
          target: aarch64-unknown-linux-gnu

      - name: Build Linux ARM64 shared lib
        run: |
          cargo build --manifest-path=ext/curve25519_dalek/Cargo.toml --release --target=aarch64-unknown-linux-gnu
          mkdir -p lib/solace/utils/linux-arm64
          cp ext/curve25519_dalek/target/aarch64-unknown-linux-gnu/release/libcurve25519_dalek.so lib/solace/utils/linux-arm64/

      - uses: actions/upload-artifact@v4
        with:
          name: libcurve25519_dalek-linux-arm64
          path: gem/lib/solace/utils/linux-arm64/libcurve25519_dalek.so

  commit-artifacts:
    name: Commit built binaries
    runs-on: ubuntu-latest
    needs: [build-linux, build-windows, build-macos, build-macos-arm64, build-linux-arm64]
    steps:
      - uses: actions/checkout@v3
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: gem/lib/solace/utils/

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add lib/solace/utils/

          # Only commit if there are changes
          if ! git diff --cached --quiet; then
            git commit -m "CI: Add built native binaries"
            git push origin HEAD:${GITHUB_REF##*/}
          else
            echo "No changes to commit"
          fi
