plugins:
  - rubocop-yard

YARD:
  Enabled: true

AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  Exclude:
    - 'solace.gemspec'
    - 'test-ledger/**/*'
    - 'vendor/**/*'

Layout/LineLength:
  Max: 120
  Exclude:
    - 'test/**/*_test.rb'
    - 'test/usecases/**/*.rb'

Metrics/ParameterLists:
  Enabled: false

Metrics/MethodLength:
  Max: 15

# Utility modules (e.g. Solace::Utils::Codecs) legitimately collect many small
# related methods; the default of 100 is too low for them.
Metrics/ModuleLength:
  Max: 150

Metrics/BlockLength:
  Exclude:
    - 'test/**/*'

Naming/AccessorMethodName:
  Enabled: false

# Prefer `extend self` over `module_function`: it keeps helpers as public
# instance methods (so utility modules can be mixed into composed encoders)
# while also exposing them as Module.<method>.
Style/ModuleFunction:
  EnforcedStyle: extend_self

# Align hash values in a column (table style) for multi-line hash literals.
Layout/HashAlignment:
  EnforcedColonStyle: table

# Enforce column alignment of consecutive `=` assignments.
Layout/ExtraSpacing:
  ForceEqualSignAlignment: true

# Numbered locals/ivars (token_2022, transfer #1/#2) read more clearly in the
# test/bootstrap narratives than the normalcase form this cop wants.
Naming/VariableNumber:
  Enabled: false
