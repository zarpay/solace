plugins:
  - rubocop-yard

# Project-local custom cops
require:
  - ./lib/rubocop/cop/solace/exploded_hash

YARD:
  Enabled: true

AllCops:
  TargetRubyVersion: 3.0
  NewCops: enable
  Exclude:
    - 'solace.gemspec'
    - 'test-ledger/**/*'
    - 'vendor/**/*'

Layout/LineLength:
  Max: 120
  Exclude:
    - 'test/**/*_test.rb'
    - 'test/usecases/**/*.rb'

Metrics/ParameterLists:
  Enabled: false

Metrics/MethodLength:
  Max: 15

# Composers and utilities collect many small, cohesive methods (e.g. the
# TransactionComposer's account/lookup-table orchestration); 100 is a touch
# tight for them while still discouraging genuinely large classes.
Metrics/ClassLength:
  Max: 125

# Utility modules (e.g. Solace::Utils::Codecs) legitimately collect many small
# related methods; the default of 100 is too low for them.
Metrics/ModuleLength:
  Max: 150

Metrics/BlockLength:
  Exclude:
    - 'test/**/*'

Naming/AccessorMethodName:
  Enabled: false

# Prefer `extend self` over `module_function`: it keeps helpers as public
# instance methods (so utility modules can be mixed into composed encoders)
# while also exposing them as Module.<method>.
Style/ModuleFunction:
  EnforcedStyle: extend_self

# A hash is read as a table, so every pair starts a line however short the hash is.
# These two only fire once a hash is already multi-line; Solace/ExplodedHash carries
# the rule that a short hash cannot escape, and skips keyword argument lists.
Layout/MultilineHashKeyLineBreaks:
  Enabled: true
Layout/FirstHashElementLineBreak:
  Enabled: true

# Align hash values in a column (table style) for multi-line hash literals.
Layout/HashAlignment:
  EnforcedColonStyle: table

# Enforce column alignment of consecutive `=` assignments.
Layout/ExtraSpacing:
  ForceEqualSignAlignment: true

# Numbered locals/ivars (token_2022, transfer #1/#2) read more clearly in the
# test/bootstrap narratives than the normalcase form this cop wants.
Naming/VariableNumber:
  Enabled: false
